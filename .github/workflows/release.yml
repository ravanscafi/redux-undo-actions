name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test -- --run

      - name: Configure release author
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config commit.gpgsign false
          git config tag.gpgsign false

      - name: Prepare release version
        run: |
          current_version="$(node -p "require('./package.json').version")"
          previous_version="$(git show ${{ github.event.before }}:package.json | jq -r .version)"
          if [[ "$current_version" == "$previous_version" ]]; then
            ./node_modules/.bin/bumpp patch --yes --no-push
          else
            git tag "v${current_version}"
          fi

      - name: Read package version
        id: package
        run: node -e "console.log('version=' + require('./package.json').version)" >> "$GITHUB_OUTPUT"

      - name: Build
        run: npm run build

      - name: Publish to npm
        run: npm publish

      - name: Push release commit and tag
        run: git push --atomic origin HEAD:main "v${{ steps.package.outputs.version }}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v${{ steps.package.outputs.version }}" --generate-notes --verify-tag
